<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orrery</title>
<meta name="theme-color" content="#f4f1ea">
<!-- The same icon the rest of the site uses, served from here rather than
     hotlinked, and declared rather than left to the browser's fallback to
     /favicon.ico at the origin root. Root-relative, so Vite rewrites each one
     with the base path at build time -- the source never names the repository,
     which is what broke when the repository was renamed. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=1">
<link rel="icon" href="/favicon.ico?v=1" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>not here <span class="dim">404</span></h1>
  <p class="sub">There is only one page, and this is not its address.
     Sending you to it now — <a id="home" href="/" style="color:var(--accent)">or go there directly</a>.</p>
</header>
<script type="module" src="./src/notfound.ts"></script>
</body>
</html>
