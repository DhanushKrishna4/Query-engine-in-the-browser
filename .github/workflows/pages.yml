name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing else in the workflow writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push finish rather than queueing behind
# an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build the site
        run: tools/build_web.sh

      # Every path in the page is relative, so the site works at
      # https://user.github.io/<repo>/ without a base path being compiled in.
      # This is the check that keeps it that way.
      - name: No absolute paths
        run: |
          if grep -rnoE '(src|href)="/[^"]|fetch\("/[^"]|from "/[^"]' web/*.html web/*.js; then
            echo "absolute path found: the site would break under a repository subpath" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
