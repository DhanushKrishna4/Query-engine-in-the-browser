[package]
name = "qe-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

# `cdylib` is what wasm32 links into a `.wasm`; `rlib` keeps the crate testable
# natively, which is how the conversions below are covered without a browser.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine" }
# Pinned exactly: wasm-bindgen refuses to run if the crate and the CLI that
# post-processes its output disagree, and the failure is a wall of symbol
# errors rather than a version message.
wasm-bindgen = "=0.2.127"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["Performance", "Window"]

# wasm-pack runs `wasm-opt` over the release output, at `-O` by default. `-O3`
# is what the spec asks for and what the module is worth: it is a megabyte of
# parser, optimizer and operators, downloaded before a single query runs.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
